<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 홈페이지</title>
  <style>
    body {
      margin: 0;
      padding: 60px 20px;
      background: #f3f6fb;
      color: #25324a;
      font-family: sans-serif;
      text-align: center;
      line-height: 1.7;
    }
    main {
      max-width: 640px;
      margin: auto;
      padding: 40px 24px;
      background: white;
      border-radius: 24px;
    }
    h1 {
      font-size: 32px;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #315efb;
      color: white;
      border-radius: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>안녕하세요! 반갑습니다 👋</h1>
    <p>저의 첫 홈페이지에 오신 것을 환영합니다.</p>
    <p>이곳에 자기소개나 가게 소개를 적어 보세요.</p>
    <a href="mailto:hello@example.com">이메일 보내기</a>
  </main>
</body>
</html>
